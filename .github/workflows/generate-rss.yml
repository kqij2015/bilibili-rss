name: Generate Bilibili RSS

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      uid:
        description: 'Bilibili UP主 UID'
        required: true
        default: '24919812'
      max_videos:
        description: '获取最近多少条视频'
        required: false
        default: '10'

permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  generate-rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate RSS
        env:
          BILIBILI_UID: ${{ github.event.inputs.uid || '24919812' }}
          RSS_MAX_VIDEOS: ${{ github.event.inputs.max_videos || '10' }}
        run: python bilibili_rss.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

